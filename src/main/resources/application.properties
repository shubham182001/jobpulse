spring.application.name=JobPulse
# DATABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SERVER
server.port=8080

# ===== GEMINI - API KEY
#spring.ai.google.genai.api-key=${LLM_API_KEY}
#spring.ai.google.genai.chat.options.model=gemini-3.8-flash

# ===== GROQ - OpenAI Compatible =====
spring.ai.openai.api-key=${OPEN_ROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.chat.options.model=openrouter/free
spring.ai.openai.chat.options.max-tokens=500

